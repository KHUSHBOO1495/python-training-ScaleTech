<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>
    <h1>Login</h1>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label>Username:</label>
            <input type="text" name="username" />
        </div>

        <div>
            <label>Password:</label>
            <input type="password" name="password" />
        </div>

        <button type="submit">Login</button>
    </form>
</body>

</html>
